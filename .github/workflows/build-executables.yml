# Builds the desktop app for Windows and macOS.
#
# - Push a tag like v1.2.0  -> builds all platforms and attaches the zips to a GitHub Release.
# - Actions tab -> "Build executables" -> Run workflow -> builds and uploads zips as
#   workflow artifacts only (no release).
#
# See README "Building the Executable" for details.
name: Build executables

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # needed to create the release on tag pushes

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest          # Apple Silicon (M1 and newer)
            platform: macos-arm64
          - os: macos-15-intel        # Intel Macs; remove this entry if no one needs it
            platform: macos-intel
    runs-on: ${{ matrix.os }}

    steps:
      # bionix-db is installed by pip from the version tag pinned in requirements.txt.
      - uses: actions/checkout@v4

      # Versions come from files in the repo, so changing them never needs a workflow edit.
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@v4
        with:
          node-version-file: code/frontend/.nvmrc

      - name: Set version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-dev"; fi
          echo "APP_VERSION=$v" >> "$GITHUB_ENV"

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: ./packaging/build.sh

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/build.ps1

      # The build scripts create the zip (named from APP_NAME in the spec).
      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.platform }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
